<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书详情 - 图书管理系统</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/admin.css">
    <style>
        .book-detail-card {
            background: white;
            border-radius: 10px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .book-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .book-icon-large {
            font-size: 64px;
            margin-right: 25px;
            color: #e74c3c;
        }

        .book-title-section h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .book-author {
            font-size: 18px;
            color: #666;
            margin-bottom: 5px;
        }

        .book-meta-badge {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 14px;
            margin-top: 10px;
        }

        .book-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .info-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
        }

        .info-group h3 {
            font-size: 16px;
            color: #495057;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .info-item {
            margin-bottom: 12px;
            display: flex;
        }

        .info-label {
            font-weight: 600;
            color: #666;
            min-width: 100px;
            margin-right: 15px;
        }

        .info-value {
            color: #333;
            flex: 1;
        }

        .more-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .more-section h3 {
            font-size: 18px;
            color: #495057;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .more-content {
            line-height: 1.8;
            color: #444;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: justify;
        }

        .error-message {
            text-align: center;
            padding: 80px 20px;
            color: #dc3545;
            background: #f8d7da;
            border-radius: 8px;
            margin: 20px;
        }

        @media (max-width: 768px) {
            .book-header {
                flex-direction: column;
                text-align: center;
            }

            .book-icon-large {
                margin-right: 0;
                margin-bottom: 15px;
            }

            .book-info-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-action {
            width: fit-content;
            padding: 12px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-brand" onclick="location.href='reader.html'">📚 图书管理系统</div>
    <a href="reader.html" class="navbar-btn">返回主页</a>
</nav>

<div class="container">
    <div id="message" class="message"></div>
    <div class="book-detail-card">
        <div class="book-header">
            <div class="book-icon-large">⚠️</div>
            <div class="book-title-section">
                <h1 id="copyId">加载中...</h1>
                <div class="book-author" id="adminId">加载中...</div>
                <div class="book-meta-badge" id="errorType">加载中...</div>
            </div>
            <div style="display: flex; flex-grow: 1; flex-direction: row-reverse">
                <button class="btn-action" id="clicker">点击处理该异常</button>
            </div>
        </div>

        <div class="book-info-grid">
            <div class="info-group">
                <h3>提交信息</h3>
                <div class="info-item">
                    <span class="info-label">提交时间：</span>
                    <span class="info-value" id="submitTime">加载中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">异常类型：</span>
                    <span class="info-value" id="errorType2">加载中...</span>
                </div>
            </div>

            <div class="info-group">
                <h3>处理详情</h3>
                <div class="info-item">
                    <span class="info-label">处理时间：</span>
                    <span class="info-value" id="handleTime">加载中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">状态：</span>
                    <span class="info-value" id="status">加载中...</span>
                </div>
            </div>
        </div>

        <div class="more-section">
            <h3>异常描述</h3>
            <div class="more-content" id="exceptionDescription">
                加载中...
            </div>
        </div>
    </div>
</div>
<script type="module">
    import {checkAndBackUser} from "./js/admin.js";
    import {showMessage} from "./js/common.js";
    import {adminLoadExceptionDetail, adminHandleExceptionDetail} from "./js/web.js";
    window.reduce = reduce;

    const API_BASE_URL = 'http://localhost:8080';

    window.onload = function () {
        const user = checkAndBackUser();
        if (!user) return;

        const urlParams = new URLSearchParams(window.location.search);
        const copyId = urlParams.get('copyId');
        const adminId = urlParams.get('adminId');
        const submitTime = urlParams.get('submitTime');

        if (copyId && adminId && submitTime) {
            fetchReduceDetails(copyId, adminId, submitTime);
            document.getElementById('clicker').addEventListener('click', (e) => {
                e.preventDefault();
                reduce(copyId, adminId, submitTime);
            })
        } else {
            document.querySelector('.book-detail-card').innerHTML =
                '<div class="error-message">缺少参数，无法获取异常信息</div>';
        }
    };

    async function fetchReduceDetails(copyId, adminId, submitTime) {
        try {
            const data = await adminLoadExceptionDetail(copyId, adminId, submitTime);

            if (!data.success) {
                console.error('获取异常详情失败:', data.message);
                return;
            }

            const reduceData = data.data;
            document.getElementById('copyId').textContent = reduceData.copyId || '暂无信息';
            document.getElementById('adminId').textContent = reduceData.adminId || '暂无信息';
            document.getElementById('errorType').textContent = reduceData.errorType || '暂无信息';
            document.getElementById('errorType2').textContent = reduceData.errorType || '暂无信息';
            document.getElementById('submitTime').textContent = reduceData.submitTime || '暂无信息';
            document.getElementById('handleTime').textContent = reduceData.handleTime || '暂无信息';
            document.getElementById('status').textContent = reduceData.status === 'Processed' ? '已处理' : '未处理';
            document.getElementById('exceptionDescription').textContent = reduceData.exceptionDescription || '暂无信息';

        } catch (error) {
            console.error('获取图书详情失败:', error);
            document.querySelector('.book-detail-card').innerHTML =
                '<div class="error-message">加载异常详情失败，请稍后重试</div>';
        }
    }

    async function reduce(copyId, adminId, submitTime) {
        try {
            const data = await adminHandleExceptionDetail(copyId, adminId, submitTime);

            if (!data.success) showMessage('网络错误', 'error');
            await fetchReduceDetails(copyId, adminId, submitTime);

        } catch (error) {
            showMessage('网络错误', 'error')
        }
    }
</script>
</body>
</html>
