<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 登录</title>
    <link rel="stylesheet" href="./css/common.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #667eea;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 图书管理系统</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="userId">用户ID</label>
                <input type="text" id="userId" name="userId" required placeholder="请输入用户ID">
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            
            <button type="submit">登录</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="link">
            <a href="register.html">还没有账号？立即注册</a>
        </div>
    </div>

    <script type="module">
        import {showMessage} from "./js/common.js";
        import {login} from "./js/web.js";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            
            try {
                const data = await login(userId, password);

                // 调试日志
                console.log('登录响应:', data);

                if (!data.success) {
                    showMessage(data.message || '登录失败', 'error', false, 3000, true);
                    return;
                }

                showMessage('登陆成功！', 'success', false);

                // 保存用户信息
                const user = data.data;
                localStorage.setItem('user', JSON.stringify(user));

                // 调试日志
                console.log('保存的用户信息:', user);
                console.log('准备跳转，角色为:', user.role);

                // 跳转到主页（根据角色）
                setTimeout(() => {
                    if (user.role === 'admin') {
                        console.log('跳转到管理员页面');
                        window.location.href = 'admin.html';
                    } else if (user.role === 'student') {
                        console.log('跳转到学生页面');
                        window.location.href = 'reader.html';
                    } else {
                        console.log('默认跳转到读者页面，角色:', data.data.role);
                        window.location.href = 'reader.html';
                    }
                }, 1000);

            } catch (error) {
                showMessage('网络错误，请稍后重试: ' + error.message, 'error', false, 3000, true);
            }
        });
    </script>
</body>
</html>
