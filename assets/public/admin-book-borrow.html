<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人工借书</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/admin.css">
    <style>
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-brand" onclick="location.href='admin.html'">🛡️ 图书管理系统</div>
    <a href="admin.html" class="navbar-btn">返回主页</a>
</nav>
<div class="container">
    <div id="message" class="message"></div>
    <div class="action-cards">
        <div class="action-card">
            <h3>📖 人工借书</h3>
            <form id="borrowForm">
                <div class="form-group">
                    <label>读者ID *</label>
                    <label for="borrowUserId"></label>
                    <input type="text" id="borrowUserId" autocomplete="off" required></div>
                <div class="form-group">
                    <label>图书副本ID *</label>
                    <label for="borrowCopyId"></label>
                    <input type="text" id="borrowCopyId" autocomplete="off" required>
                </div>
                <button type="submit" class="btn-action">确认借书</button>
            </form>
        </div>
    </div>
</div>
<script type="module">
    import {checkAndBackUser} from "./js/admin.js";
    import {showMessage} from "./js/common.js";
    import {adminBorrowBook} from "./js/web.js";

    let user = null;
    window.onload = function () {
        user = checkAndBackUser();
    };
    document.getElementById('borrowForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const userId = document.getElementById('borrowUserId').value;
            const borrowCopyId = document.getElementById('borrowCopyId').value;
            const adminId = user.userId;

            const data = await adminBorrowBook(userId, borrowCopyId, adminId);

            if (!data.success) {
                showMessage(data.message || '借书失败', 'error');
                return;
            }

            showMessage('借书成功', 'success');
            document.getElementById('borrowForm').reset();

        } catch (error) {
            showMessage('网络错误', 'error');
        }
    });
</script>
</body>
</html>
