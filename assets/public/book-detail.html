<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书详情 - 图书管理系统</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/reader.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .book-detail-card {
            background: white;
            border-radius: 10px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .book-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .book-icon-large {
            font-size: 64px;
            margin-right: 25px;
            color: #667eea;
        }

        .book-title-section h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .book-author {
            font-size: 18px;
            color: #666;
            margin-bottom: 5px;
        }

        .book-meta-badge {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 14px;
            margin-top: 10px;
        }

        .book-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .info-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-group h3 {
            font-size: 16px;
            color: #495057;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .info-item {
            margin-bottom: 12px;
            display: flex;
        }

        .info-label {
            font-weight: 600;
            color: #666;
            min-width: 100px;
            margin-right: 15px;
        }

        .info-value {
            color: #333;
            flex: 1;
        }

        .more-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .more-section h3 {
            font-size: 18px;
            color: #495057;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .more-content {
            line-height: 1.8;
            color: #444;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: justify;
        }

        /* 副本列表样式 */
        .copies-container {
            margin-top: 15px;
        }

        .copies-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .copies-table th {
            background: #f1f3f5;
            color: #495057;
            font-weight: 600;
            text-align: left;
            padding: 12px 15px;
            border-bottom: 2px solid #dee2e6;
        }

        .copies-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #dee2e6;
        }

        .copies-table tr:hover {
            background: #f8f9fa;
        }

        .copy-id {
            font-family: monospace;
            font-weight: 500;
            color: #495057;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            min-width: 80px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 14px;
        }

        .stats-summary {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #495057;
        }

        .stat-count {
            font-weight: 600;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .error-message {
            text-align: center;
            padding: 80px 20px;
            color: #dc3545;
            background: #f8d7da;
            border-radius: 8px;
            margin: 20px;
        }

        @media (max-width: 768px) {
            .book-header {
                flex-direction: column;
                text-align: center;
            }

            .book-icon-large {
                margin-right: 0;
                margin-bottom: 15px;
            }

            .book-info-grid {
                grid-template-columns: 1fr;
            }

            .copies-table {
                display: block;
                overflow-x: auto;
            }
        }

        .borrow-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .borrow-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }

        .borrow-btn:active {
            transform: translateY(0);
        }

        .borrow-btn:disabled {
            background: #e9ecef;
            color: #adb5bd;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-brand" onclick="location.href='reader.html'">📚 图书管理系统</div>
    <a href="reader.html" class="navbar-btn">返回主页</a>
</nav>

<div class="container">
    <div id="message" class="message"></div>
    <div class="book-detail-card">
        <div class="book-header">
            <div class="book-icon-large">📖</div>
            <div class="book-title-section">
                <h1 id="title">加载中...</h1>
                <div class="book-author" id="author">加载中...</div>
                <div class="book-meta-badge" id="category">加载中...</div>
            </div>
        </div>

        <div class="book-info-grid">
            <div class="info-group">
                <h3>基本信息</h3>
                <div class="info-item">
                    <span class="info-label">ISBN：</span>
                    <span class="info-value" id="isbn">加载中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">出版社：</span>
                    <span class="info-value" id="publisher">加载中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">出版日期：</span>
                    <span class="info-value" id="publishDate">加载中...</span>
                </div>
            </div>

            <div class="info-group">
                <h3>图书详情</h3>
                <div class="info-item">
                    <span class="info-label">价格：</span>
                    <span class="info-value" id="price">加载中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">页数：</span>
                    <span class="info-value" id="pages">加载中...</span>
                </div>
            </div>
        </div>

        <div class="more-section">
            <h3>内容简介</h3>
            <div class="more-content" id="description">
                加载中...
            </div>
        </div>

        <div class="more-section">
            <h3>图书副本</h3>
            <div class="copies-container" id="copies-container">
                <div class="stats-summary" id="copies-stats">
                    <div class="stat-item">
                        <span>总副本数:</span>
                        <span class="stat-count" id="total-copies">0</span>
                    </div>
                    <div class="stat-item">
                        <span>可借:</span>
                        <span class="stat-count" id="available-copies">0</span>
                    </div>
                    <div class="stat-item">
                        <span>已借出:</span>
                        <span class="stat-count" id="borrowed-copies">0</span>
                    </div>
                </div>

                <div id="copies-list">
                    <div class="empty-state">
                        <div>暂无副本信息</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="module">
    import {checkAndBackUser} from "./js/reader.js";
    import {showMessage} from "./js/common.js";
    import {readerLoadBookDetails, readerLoadBookCopies, readerBorrowBook} from "./js/web.js";

    window.borrowBook = borrowBook;

    window.onload = function () {
        const user = checkAndBackUser();
        if (!user) return;

        const urlParams = new URLSearchParams(window.location.search);
        const isbn = urlParams.get('isbn');

        if (isbn) {
            fetchBookDetails(isbn);
            fetchBookCopies(user.userId, isbn);
        } else {
            showMessage('缺少ISBN参数，无法获取图书信息', 'error');
            document.querySelector('.book-detail-card').innerHTML =
                '<div class="error-message">缺少ISBN参数，无法获取图书信息</div>';
        }
    };

    async function fetchBookDetails(isbn) {
        try {
            const data = await readerLoadBookDetails(isbn)

            if (!data.success) return;
            const bookData = await data.json();
            document.getElementById('isbn').textContent = bookData.isbn || '暂无信息';
            document.getElementById('title').textContent = bookData.title || '暂无信息';
            document.getElementById('author').textContent = bookData.author || '暂无信息';
            document.getElementById('category').textContent = bookData.category || '暂无信息';
            document.getElementById('publisher').textContent = bookData.publisher || '暂无信息';
            document.getElementById('publishDate').textContent = bookData.publishDate || '暂无信息';
            document.getElementById('price').textContent = bookData.price ? `¥${bookData.price}` : '暂无信息';
            document.getElementById('pages').textContent = bookData.pages ? `${bookData.pages}页` : '暂无信息';
            document.getElementById('description').textContent = bookData.description || '暂无简介';

            document.getElementById('total-copies').textContent = `${bookData.totalCount}`;
            document.getElementById('available-copies').textContent = `${bookData.availableCount}`;
            document.getElementById('borrowed-copies').textContent = `${bookData.totalCount - bookData.availableCount}`;
        } catch (e) {
            console.error('获取图书详情失败:', e);
            showMessage('加载图书详情失败，请稍后重试', 'error');
            document.querySelector('.book-detail-card').innerHTML =
                '<div class="error-message">加载图书详情失败，请稍后重试</div>';
        }
    }

    async function fetchBookCopies(userId, isbn) {
        try {
            const data = await readerLoadBookCopies(userId, isbn)

            if (!data.success) {
                showMessage('加载副本信息失败，请稍后重试', 'error');
                return;
            }

            const copiesData = data.data;
            if (!copiesData || copiesData.length <= 0) {
                renderEmptyCopies();
                return;
            }

            renderCopiesList(userId, copiesData, isbn);
        } catch (e) {
            showMessage('加载副本信息失败，请稍后重试', 'error');
        }
    }

    async function borrowBook(userId, isbn, copyId) {
        try {
            const data = await readerBorrowBook(userId, isbn, copyId);

            if (!data.success) showMessage('网络错误', 'error');

            await fetchBookDetails(isbn);
            await fetchBookCopies(userId, isbn);
        } catch (error) {
            showMessage('网络错误', 'error')
        }
    }

    function renderCopiesList(userId, copies, isbn) {
        const copiesListContainer = document.getElementById('copies-list');

        if (copies.length === 0) {
            renderEmptyCopies();
            return;
        }

        let html = `
            <table class="copies-table">
                <thead>
                    <tr>
                        <th>副本ID</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
        `;

        copies.forEach(copy => {
            let statusClass = '';
            let statusText = '';
            let canBorrow = false;
            let disabledTitle = '';

            switch (copy.status) {
                case 'available':
                    statusClass = 'status-available';
                    statusText = '可借';
                    canBorrow = true;
                    disabledTitle = '';
                    break;
                case 'borrowed':
                    statusClass = 'status-borrowed';
                    statusText = '已借出';
                    canBorrow = false;
                    disabledTitle = '该副本已借出';
                    break;
                case 'damaged':
                    statusClass = 'status-damaged';
                    statusText = '损坏';
                    canBorrow = false;
                    disabledTitle = '该副本已损坏，无法借阅';
                    break;
                case 'lost':  // 添加 lost 状态
                    statusClass = 'status-lost';
                    statusText = '丢失';
                    canBorrow = false;
                    disabledTitle = '该副本已丢失';
                    break;
                default:
                    statusClass = 'status-borrowed';
                    statusText = copy.status || '未知';
                    canBorrow = false;
                    disabledTitle = '该副本状态异常';
            }

            html += `
            <tr>
                <td class="copy-id">${copy.copyId || '未知'}</td>
                <td>
                    <span class="status-badge ${statusClass}">${statusText}</span>
                </td>
                <td>
                    ${canBorrow ?
                `<button class="borrow-btn" onclick="borrowBook('${userId}', '${isbn}', '${copy.copyId}')">借阅</button>` :
                `<button class="borrow-btn" disabled title="${disabledTitle}">不可借</button>`
            }
                </td>
            </tr>
        `;
        });

        html += `
                </tbody>
            </table>
        `;

        copiesListContainer.innerHTML = html;
    }

    function renderEmptyCopies() {
        const copiesListContainer = document.getElementById('copies-list');
        copiesListContainer.innerHTML = `
            <div class="empty-state">
                <div>暂无副本信息</div>
            </div>
        `;

        // 重置统计信息
        document.getElementById('total-copies').textContent = '0';
        document.getElementById('available-copies').textContent = '0';
        document.getElementById('borrowed-copies').textContent = '0';
    }
</script>
</body>
</html>
